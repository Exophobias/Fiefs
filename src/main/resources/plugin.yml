name: Fiefs
version: '${project.version}'
main: dansplugins.fiefs.Fiefs
# A FLOOR, not a pin: one jar built against 26.1.2 loads on 26.1.x and 26.2 alike.
api-version: '26.1'
author: DanTheTechMan
depend: [MedievalFactions]

commands:
  fiefs:
  fi:

permissions:
  # Bare /fi (the credits banner). Declared explicitly because an undeclared permission falls through
  # to Bukkit's DEFAULT_PERMISSION, which is OP -- silently making /fi op-only.
  fiefs.default:
    default: true
  fiefs.help:
    default: true
  fiefs.list:
    default: true
  fiefs.create:
    default: true
  fiefs.disband:
    default: true
  fiefs.claim:
    default: true
  fiefs.unclaim:
    default: true
  fiefs.checkclaim:
    default: true
  fiefs.info:
    default: true
  fiefs.invite:
    default: true
  fiefs.join:
    default: true
  fiefs.leave:
    default: true
  fiefs.members:
    default: true
  fiefs.desc:
    default: true
  fiefs.kick:
    default: true
  fiefs.transfer:
    default: true
  fiefs.rename:
    default: true
  fiefs.flags:
    default: true
  fiefs.config:
    default: op