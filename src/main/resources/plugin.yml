name: Fiefs
version: '${project.version}'
main: dansplugins.fiefs.Fiefs
# A FLOOR, not a pin: one jar built against 26.1.2 loads on 26.1.x and 26.2 alike.
api-version: '26.1'
author: DanTheTechMan
depend: [MedievalFactions]
# Soft, because a fief with no arms is still a fief. It has to be declared even so: Paper only lets a
# plugin see another plugin's classes when a relationship between them is declared, and softdepend also
# enables PatriamHeraldry before Fiefs so its api is loadable when the bridge registers. Every class
# that touches those types is guarded; see dansplugins.fiefs.heraldry.HeraldryPresence.
softdepend: [PatriamHeraldry]

commands:
  fiefs:
  fi:

permissions:
  # Bare /fi (the credits banner). Declared explicitly because an undeclared permission falls through
  # to Bukkit's DEFAULT_PERMISSION, which is OP -- silently making /fi op-only.
  fiefs.default:
    default: true
  fiefs.help:
    default: true
  fiefs.list:
    default: true
  fiefs.create:
    default: true
  fiefs.disband:
    default: true
  fiefs.claim:
    default: true
  fiefs.unclaim:
    default: true
  fiefs.checkclaim:
    default: true
  fiefs.info:
    default: true
  fiefs.invite:
    default: true
  fiefs.join:
    default: true
  fiefs.leave:
    default: true
  fiefs.members:
    default: true
  fiefs.desc:
    default: true
  fiefs.kick:
    default: true
  fiefs.transfer:
    default: true
  # Naming an heir is the fief holder's own business, so it is open like the rest of the fief
  # commands; the command itself checks that the caller actually holds the fief.
  fiefs.heir:
    default: true
  # Reading who stands to inherit a fief, and by what rule. Default true and open like the rest of
  # the fief commands, and deliberately so: this is the readout that tells a player whether their
  # server's government layer is actually deciding anything, and a check nobody can run is a check
  # that cannot catch the failure it exists for. The command itself limits the audience to the
  # fief's members and the head of the faction it is held from.
  fiefs.succession:
    default: true
  # A fief's capital is the ground a rising is won and lost on, and naming it is the holder's own
  # business like every other fief command. The command checks that the caller holds the fief and
  # that the fief actually claims the chunk they are standing in.
  fiefs.capital:
    default: true
  # Granting and revoking are checked against the faction's recorded head at execution time, so
  # these stay default-true like every other fief command rather than being op-gated. The permission
  # exists so a server can take the capability away, not to decide who is head of a faction.
  fiefs.grant:
    default: true
  fiefs.revoke:
    default: true
  fiefs.rename:
    default: true
  fiefs.flags:
    default: true
  fiefs.config:
    default: op