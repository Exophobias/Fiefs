name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Fiefs compiles against the stable API in our Medieval-Factions fork
      # (com.dansplugins.factionsystem.api), which is published to no public repository:
      # repo.dansplugins.com stops at 5.7.2, which predates the API entirely. Rather than commit a
      # 12 MB jar, build the fork from source and install it into the local Maven repository.
      #
      # Worth the few minutes: Fiefs is then always compiled against the CURRENT fork, so an API
      # change breaks the build here rather than the live server.
      #
      # Checked out to an untracked path so it stays out of the conflict-marker scan below.
      - name: Check out the Medieval-Factions fork
        uses: actions/checkout@v7
        with:
          repository: Exophobias/Medieval-Factions
          ref: patriam/target-26.1.2
          path: .mf-src

      # Medieval-Factions pins Gradle 7.6.4, which cannot run on JDK 21+. Its output is Java 17
      # bytecode, which runs fine on a Java 25 server and compiles fine against Java 25 here.
      # Installed before the JDK 25 step only so JAVA_HOME_17_X64 exists for the publish step;
      # JAVA_HOME itself stays on 25 for the Maven build.
      - name: Set up JDK 17 (to build Medieval-Factions)
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          # Java 25 is the hard minimum for Minecraft 26.1+, and paper-api ships class-file
          # major 69, so it is also the floor for compiling against it. JDK 17 and 21 both reject
          # paper-api outright ("wrong version 69.0, should be 61.0").
          java-version: '25'
          distribution: temurin

      # Cached explicitly rather than via setup-java's `cache: maven`, matching PatriamMFAddon,
      # where that option silently stopped caching on v5.
      #
      # com/dansplugins is excluded on purpose: the fork is republished from source on every run,
      # so caching it could only ever serve a stale jar.
      - name: Cache the Maven repository
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/com/dansplugins
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      # ORDER IS LOAD-BEARING: must come after the cache restore. Restoring untars over ~/.m2, so
      # publishing first would let a stale cached jar overwrite the fresh fork, and the build would
      # compile against an old API while the publish step still reported success.
      - name: Install the Medieval-Factions fork to the local Maven repository
        working-directory: .mf-src
        env:
          # This step alone runs on 17; JAVA_HOME stays on 25 everywhere else.
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon publishToMavenLocal

      # Cheap, and it fails before Maven starts. Nothing parses plugin.yml at build time -- `mvn
      # package` copies it into the jar verbatim -- so a conflict marker in it ships silently.
      - name: Reject git conflict markers
        run: |
          if git grep -nE '^(<{7}|={7}|>{7})(\s|$)' -- . ':(exclude).github/workflows/build.yml'; then
            echo "::error::Git conflict markers found in tracked files (see above)."
            exit 1
          fi
          echo "No conflict markers."

      - name: Build and test
        run: mvn -B --no-transfer-progress verify

      # MockBukkit reports un-mocked API as *skipped* rather than failed, so a green build can hide
      # tests that silently stopped exercising anything. Treat any skip as a failure.
      - name: Fail on skipped tests
        run: |
          skipped=$(grep -ho 'skipped="[0-9]*"' target/surefire-reports/*.xml 2>/dev/null \
            | grep -o '[0-9]*' | paste -sd+ - | bc 2>/dev/null || echo 0)
          echo "Skipped tests: ${skipped:-0}"
          if [ "${skipped:-0}" -ne 0 ]; then
            echo "::error::${skipped} test(s) were skipped; skipped tests are treated as failures here."
            exit 1
          fi

      - name: Verify the jar declares a main class that exists inside it
        run: |
          jar=target/Fiefs.jar
          main=$(unzip -p "$jar" plugin.yml | sed -n 's/^main:[[:space:]]*//p')
          echo "Declared main: $main"
          case "$main" in
            *'${'*) echo "::error::main is an unresolved Maven expression: $main"; exit 1 ;;
            '')     echo "::error::plugin.yml declares no main class"; exit 1 ;;
          esac
          path="$(echo "$main" | tr '.' '/').class"
          if ! unzip -l "$jar" | grep -qF "$path"; then
            echo "::error::plugin.yml declares main: $main but $path is not in the jar."
            exit 1
          fi
          echo "OK: $path is present in the jar."

      # The whole point of dropping Ponder was that 71% of the old jar was unrelocated JUnit and
      # Hamcrest. Every dependency is `provided`, so anything outside dansplugins/ means some
      # dependency regained a bundling scope.
      - name: Verify the jar bundles no third-party classes
        run: |
          # unzip -Z1 lists entry names only. Do NOT use `unzip -l | awk '{print $4}'`: it emits the
          # "Name"/"----" header rows, and anchoring the allowed prefixes with $ then rejects real
          # entries like META-INF/MANIFEST.MF. That mistake made this check fail on a clean jar.
          stray=$(unzip -Z1 target/Fiefs.jar | grep -vE '^(dansplugins/|META-INF/|plugin\.yml)' || true)
          if [ -n "$stray" ]; then
            echo "::error::Unexpected non-Fiefs entries in the jar:"; echo "$stray"; exit 1
          fi
          echo "Jar contains only Fiefs classes ($(unzip -Z1 target/Fiefs.jar | wc -l) entries)."

      - name: Upload plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: Fiefs
          path: target/Fiefs.jar
          if-no-files-found: error
