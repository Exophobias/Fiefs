name: Release

on:
  release:
    types: [ created ]

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Same prerequisite as the build workflow: the stable API Fiefs compiles against lives only
      # in our Medieval-Factions fork, so it has to be built from source first.
      - name: Check out the Medieval-Factions fork
        uses: actions/checkout@v7
        with:
          repository: Exophobias/Medieval-Factions
          ref: patriam/target-26.1.2
          path: .mf-src

      # Gradle 7.6.4 cannot run on JDK 21+; installed first so JAVA_HOME_17_X64 exists below.
      - name: Set up JDK 17 (to build Medieval-Factions)
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: Install the Medieval-Factions fork to the local Maven repository
        working-directory: .mf-src
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon publishToMavenLocal

      - name: Build with Maven
        run: mvn -B --no-transfer-progress clean package

      # Named explicitly rather than globbed. maven-shade-plugin is gone, so there is no
      # original-*.jar to exclude any more, and finalName pins the output to exactly this file.
      - name: Upload JAR to release
        uses: softprops/action-gh-release@v2
        with:
          files: target/Fiefs.jar
