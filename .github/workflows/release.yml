name: Release

on:
  release:
    types: [ created ]

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Same prerequisite as the build workflow: the stable API Fiefs compiles against lives only
      # in our Medieval-Factions fork, so it has to be built from source first.
      - name: Check out the Medieval-Factions fork
        uses: actions/checkout@v7
        with:
          repository: Exophobias/Medieval-Factions
          # Keep in step with build.yml: main is the only branch carrying 5.9.0-patriam.1-SNAPSHOT.
          ref: main
          path: .mf-src

      # A released jar is compiled against whatever main pointed at when this job fetched, and until
      # now nothing recorded which commit that was. See the long note in build.yml: a run there once
      # fetched main 21 seconds before the push it needed and failed with a compile error that named
      # the wrong culprit. Here the equivalent would not fail at all, it would ship.
      - name: Report the Medieval-Factions commit, and reject one that raced a push
        working-directory: .mf-src
        run: |
          head=$(git rev-parse HEAD)
          live=$(git ls-remote origin refs/heads/main | cut -f1)
          {
            echo "### Medieval-Factions fork this release was built against"
            echo "- commit: \`$head\`"
            echo "- $(git log -1 --format='%cI %s' HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Checked out: $head"
          echo "Live main:   $live"
          if [ -z "$live" ]; then
            echo "::error::Could not read the live tip of Medieval-Factions main."
            exit 1
          fi
          if [ "$head" != "$live" ]; then
            echo "::error::Medieval-Factions main moved after this job fetched it ($head -> $live)."
            echo "::error::Releasing would ship a jar compiled against the older API. Re-run the job."
            exit 1
          fi
          echo "The checked-out fork is the current tip of main."

      # Gradle 7.6.4 cannot run on JDK 21+; installed first so JAVA_HOME_17_X64 exists below.
      - name: Set up JDK 17 (to build Medieval-Factions)
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: Install the Medieval-Factions fork to the local Maven repository
        working-directory: .mf-src
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon publishToMavenLocal

      # Also the same prerequisite: PatriamHeraldry is private, so its api is committed to libs/ and
      # installed from there rather than built from source. See libs/README.md. There is no cache in
      # this workflow, so the ordering note in build.yml does not apply, but the -DpomFile does: the
      # descriptor embedded in the jar names a parent that is not vendored.
      - name: Install the vendored API jar
        working-directory: libs
        run: |
          sha256sum -c CHECKSUMS
          mvn -B --no-transfer-progress install:install-file \
            -Dfile=patriamheraldry-api-1.0.0.jar -DpomFile=patriamheraldry-api-1.0.0.pom

      - name: Build with Maven
        run: mvn -B --no-transfer-progress clean package

      # Named explicitly rather than globbed. maven-shade-plugin is gone, so there is no
      # original-*.jar to exclude any more, and finalName pins the output to exactly this file.
      - name: Upload JAR to release
        uses: softprops/action-gh-release@v2
        with:
          files: target/Fiefs.jar
